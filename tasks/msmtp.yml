---

# Author: Adham Helal
#
# Objective: Deploy msmtp

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: mail
  when: ansible_os_family == "Debian"

- name: Install msmtp and mailx on Debian
  ansible.builtin.apt:
    name:
      - msmtp
      - msmtp-mta
      - bsd-mailx
    state: present
  tags: mail
  notify: test mail
  when: ansible_os_family == "Debian"

- name: Install msmtp and mailx
  community.general.pacman:
    name:
      - msmtp
      - msmtp-mta
      - mailutils
    state: present
  when: ansible_os_family == "Archlinux"

- name: Copy mstprc conf file
  ansible.builtin.template:
    src: msmtprc.j2
    dest: /etc/msmtprc
    owner: root
    group: root
    mode: "0644"
  tags: mail
  notify: test mail

- name: Copy aliases conf file
  ansible.builtin.template:
    src: aliases.j2
    dest: /etc/aliases
    owner: root
    group: root
    mode: "0644"
  tags: mail
  notify: test mail
